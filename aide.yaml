# Aide for Agents manifest (v0 draft; format will follow the platform API)
name: aide
title: Aide for Agents
version: 0.0.1          # keep in sync with template/.aide/VERSION
schema: 1               # keep in sync with schema in template/.state.json

home:
  default: ~/aide
  env: AIDE_HOME

entry: skill.md
template: template/

routines:
  - id: daily-brief
    instructions: .aide/routines/daily-brief.md
    default_schedule: "30 8 * * *"   # local time; confirmed with the user during onboarding
    mode: read-only   # except adding todos to the user's chosen todo list
