# Aide for Agents manifest (v0 draft; format will follow the platform API)
name: aide
title: Aide for Agents
version: 0.1.1          # keep in sync with template/system/VERSION
schema: 1               # keep in sync with schema in template/state.json

home:
  default: ~/aide
  env: AIDE_HOME

entry: skill.md
template: template/

routines:
  - id: daily-brief
    instructions: system/routines/daily-brief.md
    default_schedule: "30 8 * * *"   # local time; confirmed with the user during onboarding
    mode: read-only
